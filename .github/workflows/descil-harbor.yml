name: DeSciL Harbor CI

# Builds the DeSciL-branded renku-ui client image and pushes it to the DeSciL
# harbor at registry.vlab.ethz.ch. The Renku Helm chart pulls this image via
# ui.client.image.repository/tag (infra/renku/renku-values.yaml in DescilK8S).
# The target harbor project `renku` is PUBLIC, so pulls are anonymous.
#
# Follows the DeSciL house CI pattern (see DeSciL/DescilRenku): tag-triggered,
# runs on the in-cluster ARC runners (`descil-runners`, no direct internet → ETH
# proxy build-args), harbor login via org secrets, cosign sign + verify.
#
# NOTE: the renku-ui client image builds from the `client/` subdirectory.

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  LABEL: renku-ui
  HARBOR: ${{ secrets.HARBOR_REGISTRY_URL }}
  HARBOR_PROJECT: renku

jobs:
  build:
    runs-on: descil-runners
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.HARBOR_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_REGISTRY_USER }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

      - name: Build and push to Harbor
        id: build-push
        uses: docker/build-push-action@v7
        with:
          # The client image build context is the client/ subdir (its Dockerfile
          # COPYs package.json/src/public/server relative to client/).
          context: client
          file: client/Dockerfile
          push: true
          provenance: false
          # Self-hosted runners reach the internet only via the ETH proxy — needed
          # for `npm ci` and the base-image apt-get in client/Dockerfile.
          build-args: |
            http_proxy=http://proxy.ethz.ch:3128
            https_proxy=http://proxy.ethz.ch:3128
            HTTP_PROXY=http://proxy.ethz.ch:3128
            HTTPS_PROXY=http://proxy.ethz.ch:3128
            no_proxy=localhost,127.0.0.1
            NO_PROXY=localhost,127.0.0.1
            SHORT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/DeSciL/renku-ui
            org.opencontainers.image.description=DeSciL-branded renku-ui client image
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            ${{ env.HARBOR }}/${{ env.HARBOR_PROJECT }}/${{ env.LABEL }}:${{ steps.version.outputs.tag }}
            ${{ env.HARBOR }}/${{ env.HARBOR_PROJECT }}/${{ env.LABEL }}:latest

      - name: Sign Harbor image
        run: |
          DIGEST="${{ steps.build-push.outputs.digest }}"
          echo "Signing Harbor image: ${{ env.HARBOR }}/${{ env.HARBOR_PROJECT }}/${{ env.LABEL }}@${DIGEST}"
          cosign sign --yes ${{ env.HARBOR }}/${{ env.HARBOR_PROJECT }}/${{ env.LABEL }}@${DIGEST}

      - name: Verify Harbor signature
        run: |
          DIGEST="${{ steps.build-push.outputs.digest }}"
          echo "Checking Harbor signature..."
          cosign tree ${{ env.HARBOR }}/${{ env.HARBOR_PROJECT }}/${{ env.LABEL }}@${DIGEST}
